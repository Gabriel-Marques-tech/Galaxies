[project]
name = "galaxies"
version = "0.1.0"
description = "Framework preditivo de performance de YouTube Shorts, operado via MCP"
authors = [
    { name = "Gabriel Marques", email = "gabrielmarques.t3ch@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pytz>=2026.5",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
multimodal = [
    "faster-whisper>=1.2.1",
    "pillow>=13.0.0",
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
